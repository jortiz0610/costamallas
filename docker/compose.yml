# ============================================================
# Lo que corre en el VPS. Va en /srv/portal/compose.yml.
#
# Tres piezas y ninguna más:
#
#   postgres · la base. Es DEL CLIENTE: su servidor, su clave, su
#              respaldo. Es la línea que hace defendible todo lo demás —
#              el día que pregunten "¿y si ESEK desaparece?", la
#              respuesta es "tus datos están en tu máquina".
#   portal   · la imagen ya compilada, bajada de GHCR. No construye
#              nada: si construyera, el código fuente acabaría aquí.
#   caddy    · el HTTPS. Saca y renueva los certificados solo.
#
# Ni postgres ni portal publican puertos. Lo único abierto al mundo es
# Caddy en 80 y 443. Una base de datos con el 5432 asomado a internet se
# encuentra sola en cuestión de horas.
#
#   docker compose up -d          levantar o actualizar
#   docker compose logs -f portal ver qué pasa
#   docker compose ps             qué está vivo
#
# Las variables salen de /srv/portal/.env, que crea ESEK con permisos
# 600. Ese archivo no está en el repositorio ni puede estarlo.
# ============================================================

name: costamallas

services:
  postgres:
    # Versión FIJA, no `latest`. Postgres no baja de versión: si un día
    # arranca con una mayor y hay que volver atrás, no se puede.
    #
    # **18 y no 16**, que es lo que decía aquí antes y estaba mal.
    # Comprobado contra el origen: Supabase corre **17.6**, y un volcado
    # de una base más nueva NO restaura en una más vieja — el error sale
    # a mitad de la restauración, con media base ya escrita. Se elige 18
    # y no 17 porque las herramientas del servidor (pg_dump, psql) son
    # 18.6: volcar con una versión más nueva que el origen está
    # soportado, pero restaurar con una más nueva que el destino no.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-costamallas}
      POSTGRES_USER: ${POSTGRES_USER:-costamallas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en /srv/portal/.env}
      # Para que las fechas de los registros se lean como las lee la
      # empresa y no haya que restar cinco horas mentalmente.
      TZ: America/Bogota
    volumes:
      # Fuera del contenedor a propósito: borrar el contenedor no puede
      # llevarse la base por delante.
      #
      # ⚠️ `/var/lib/postgresql` y NO `/var/lib/postgresql/data`, que es
      # lo que se pone en todos los ejemplos de internet y lo que había
      # aquí. La imagen 18 cambió el convenio: espera el montaje un
      # nivel más arriba y guarda los datos en un subdirectorio con el
      # número de versión, para que un día se pueda hacer `pg_upgrade`
      # sin pelearse con el límite del montaje. Con la ruta vieja el
      # contenedor arranca, se queja y se queda reiniciándose en bucle.
      - /srv/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-costamallas} -d ${POSTGRES_DB:-costamallas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [interna]

  portal:
    # La etiqueta se cambia A MANO al actualizar. Nada de `latest`: con
    # `latest` no se sabe qué está corriendo ni se puede volver a la
    # versión de ayer, que es lo único que salva una noche mala.
    image: ghcr.io/jortiz0610/costamallas-portal:${VERSION:?falta VERSION en /srv/portal/.env}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        # Que espere a que la base conteste, no a que el contenedor
        # exista: arrancar contra una base que todavía no acepta
        # conexiones hace fallar las migraciones del arranque.
        condition: service_healthy
    networks: [interna]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # A dónde avisa Let's Encrypt si un certificado va a vencer sin
      # renovarse. Sin esto no hay a quién avisar.
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en /srv/portal/.env}
      # Qué dominios sirve. Durante las pruebas es el host de Hostinger;
      # el día del corte pasan a ser los de la empresa. Cambiar esta
      # línea del .env y reiniciar Caddy es toda la maniobra.
      DOMINIOS: ${DOMINIOS:?falta DOMINIOS en /srv/portal/.env}
    volumes:
      - /srv/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados. Si esto no persiste, cada reinicio pide
      # certificados nuevos y Let's Encrypt acaba bloqueando el dominio
      # por límite de peticiones.
      - /srv/caddy/datos:/data
      - /srv/caddy/config:/config
    depends_on:
      - portal
    networks: [interna]

networks:
  interna:
    driver: bridge
