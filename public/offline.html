<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Costamallas</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      :root {
        color-scheme: light dark;
        --amarillo: #f9df1e;
        --tinta: #0f172a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--tinta);
        color: #e5e7eb;
      }
      .caja { max-width: 26rem; text-align: center; }
      .marca {
        width: 76px; height: 76px; border-radius: 20px;
        background: var(--amarillo);
        display: grid; place-items: center;
        margin: 0 auto 1.5rem;
      }
      .marca img { width: 52px; height: 52px; }
      h1 { font-size: 1.35rem; margin: 0 0 0.6rem; font-weight: 700; }
      p { font-size: 0.9rem; line-height: 1.6; color: #9ca3af; margin: 0 0 1.75rem; }
      button {
        font: inherit; font-weight: 600; font-size: 0.9rem;
        padding: 0.7rem 1.5rem; border: 0; border-radius: 0.75rem;
        background: var(--amarillo); color: var(--tinta);
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
      .pie { margin-top: 2.5rem; font-size: 0.7rem; color: #4b5563; letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <div class="caja">
      <div class="marca"><img src="/icons/icon-192.png" alt="Costamallas" /></div>
      <h1>Sin conexión</h1>
      <p>
        No pudimos contactar el servidor. El portal necesita internet para mostrarte
        datos al día: no te enseñamos información vieja a propósito.
      </p>
      <button onclick="location.reload()">Reintentar</button>
      <p class="pie">COSTAMALLAS · SEMBLA BY ESEK</p>
    </div>
    <script>
      // Reintenta solo cuando el navegador recupera la red.
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
